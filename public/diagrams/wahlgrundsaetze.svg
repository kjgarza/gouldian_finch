<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Die fünf Wahlgrundsätze des Grundgesetzes: allgemein, unmittelbar, frei, gleich und geheim, dazu aktives und passives Wahlrecht.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">Die fünf Wahlgrundsätze</text>
  <text x="28" y="70" font-size="15" fill="#64748b">The five principles of elections</text>

  <!-- Central node -->
  <rect x="108" y="84" width="384" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="120" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">Wahlgrundsätze</text>
  <text x="300" y="144" font-size="18" fill="#0f172a" text-anchor="middle">Bundestagswahl · Art. 38 GG</text>
  <text x="300" y="164" font-size="15" fill="#64748b" text-anchor="middle">electoral principles, Basic Law Article 38</text>

  <!-- Spine -->
  <line x1="300" y1="176" x2="300" y2="188" stroke="#64748b" stroke-width="2.5"/>
  <line x1="58" y1="188" x2="300" y2="188" stroke="#64748b" stroke-width="2.5"/>
  <line x1="58" y1="188" x2="58" y2="552" stroke="#64748b" stroke-width="2.5"/>
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="58" y1="232" x2="78" y2="232" marker-end="url(#a)"/>
    <line x1="58" y1="312" x2="78" y2="312" marker-end="url(#a)"/>
    <line x1="58" y1="392" x2="78" y2="392" marker-end="url(#a)"/>
    <line x1="58" y1="472" x2="78" y2="472" marker-end="url(#a)"/>
    <line x1="58" y1="552" x2="78" y2="552" marker-end="url(#a)"/>
  </g>

  <!-- 1 allgemein -->
  <rect x="84" y="196" width="488" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="222" font-size="22" font-weight="600" fill="#0f172a">allgemein</text>
  <text x="104" y="243" font-size="18" fill="#0f172a">alle ab 18 Jahren dürfen wählen</text>
  <text x="104" y="261" font-size="15" fill="#64748b">universal: every citizen aged 18 or over may vote</text>

  <!-- 2 unmittelbar -->
  <rect x="84" y="276" width="488" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="302" font-size="22" font-weight="600" fill="#0f172a">unmittelbar</text>
  <text x="104" y="323" font-size="18" fill="#0f172a">direkt, keine Wahlmänner</text>
  <text x="104" y="341" font-size="15" fill="#64748b">direct: no electors stand in between</text>

  <!-- 3 frei -->
  <rect x="84" y="356" width="488" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="382" font-size="22" font-weight="600" fill="#0f172a">frei</text>
  <text x="104" y="403" font-size="18" fill="#0f172a">kein Zwang, keine Beeinflussung</text>
  <text x="104" y="421" font-size="15" fill="#64748b">free: no coercion and no pressure</text>

  <!-- 4 gleich -->
  <rect x="84" y="436" width="488" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="462" font-size="22" font-weight="600" fill="#0f172a">gleich</text>
  <text x="104" y="483" font-size="18" fill="#0f172a">jede Stimme zählt gleich viel</text>
  <text x="104" y="501" font-size="15" fill="#64748b">equal: every vote has the same weight</text>

  <!-- 5 geheim -->
  <rect x="84" y="516" width="488" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="542" font-size="22" font-weight="600" fill="#0f172a">geheim</text>
  <text x="104" y="563" font-size="18" fill="#0f172a">niemand sieht, wie man wählt</text>
  <text x="104" y="581" font-size="15" fill="#64748b">secret: nobody sees how you voted</text>

  <!-- Wahlrecht footer -->
  <rect x="28" y="610" width="544" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="640" font-size="18" fill="#0f172a">aktives Wahlrecht: selbst wählen dürfen</text>
  <text x="46" y="658" font-size="15" fill="#64748b">active right to vote — you may cast a vote</text>
  <text x="46" y="686" font-size="18" fill="#0f172a">passives Wahlrecht: sich wählen lassen</text>
  <text x="46" y="704" font-size="15" fill="#64748b">passive right — you may stand as a candidate</text>
</svg>
