<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Artikel 20 des Grundgesetzes nennt fünf Staatsprinzipien: Demokratie, Bundesstaat, Rechtsstaat, Sozialstaat und Republik.</title>
  <rect width="600" height="800" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">Staatsprinzipien nach Art. 20 GG</text>
  <text x="28" y="70" font-size="15" fill="#64748b">The five constitutional principles, Article 20 Basic Law</text>

  <rect x="28" y="88" width="544" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="122" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">Artikel 20 Grundgesetz</text>
  <text x="300" y="146" font-size="20" font-weight="600" fill="#0f172a" text-anchor="middle">Die fünf Staatsprinzipien</text>
  <text x="300" y="164" font-size="15" fill="#64748b" text-anchor="middle">Germany is a democratic, federal, law-bound, social republic</text>

  <!-- 1 Demokratie -->
  <rect x="28" y="188" width="544" height="106" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="222" font-size="22" font-weight="600" fill="#0f172a">1 · Demokratie</text>
  <text x="46" y="250" font-size="18" fill="#0f172a">„Alle Staatsgewalt geht vom Volke aus.“</text>
  <text x="46" y="272" font-size="15" fill="#64748b">Democracy – all state authority comes from the people</text>
  <text x="46" y="288" font-size="15" fill="#64748b">(Volkssouveränität)</text>

  <!-- 2 Bundesstaat -->
  <rect x="28" y="306" width="544" height="106" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="340" font-size="22" font-weight="600" fill="#0f172a">2 · Bundesstaat</text>
  <text x="46" y="368" font-size="18" fill="#0f172a">Der Bund und die 16 Bundesländer</text>
  <text x="46" y="390" font-size="15" fill="#64748b">Federal state – power is shared between the federation</text>
  <text x="46" y="406" font-size="15" fill="#64748b">and the 16 federal states</text>

  <!-- 3 Rechtsstaat -->
  <rect x="28" y="424" width="544" height="106" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="458" font-size="22" font-weight="600" fill="#0f172a">3 · Rechtsstaat</text>
  <text x="46" y="486" font-size="18" fill="#0f172a">Bindung an Gesetze, Gewaltenteilung</text>
  <text x="46" y="508" font-size="15" fill="#64748b">Rule of law – the state is bound by law,</text>
  <text x="46" y="524" font-size="15" fill="#64748b">powers are separated</text>

  <!-- 4 Sozialstaat -->
  <rect x="28" y="542" width="544" height="106" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="576" font-size="22" font-weight="600" fill="#0f172a">4 · Sozialstaat</text>
  <text x="46" y="604" font-size="18" fill="#0f172a">Soziale Sicherheit für alle</text>
  <text x="46" y="626" font-size="15" fill="#64748b">Welfare state – the state protects people in need,</text>
  <text x="46" y="642" font-size="15" fill="#64748b">e.g. illness, old age, unemployment</text>

  <!-- 5 Republik -->
  <rect x="28" y="660" width="544" height="106" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="694" font-size="22" font-weight="600" fill="#0f172a">5 · Republik</text>
  <text x="46" y="722" font-size="18" fill="#0f172a">Gewähltes Staatsoberhaupt, kein Monarch</text>
  <text x="46" y="744" font-size="15" fill="#64748b">Republic – the head of state is elected,</text>
  <text x="46" y="760" font-size="15" fill="#64748b">Germany is not a monarchy</text>
</svg>
