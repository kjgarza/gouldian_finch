<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Parteien ziehen mit mindestens fünf Prozent der Stimmen in den Bundestag ein; dort bilden die Koalitionsparteien die Regierung und alle übrigen Abgeordneten die Opposition.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">Regierung und Opposition</text>
  <text x="28" y="70" font-size="15" fill="#64748b">Government and opposition in the Bundestag</text>

  <!-- Parties -->
  <rect x="28" y="92" width="544" height="84" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="124" font-size="22" font-weight="600" fill="#0f172a">Parteien</text>
  <text x="46" y="148" font-size="18" fill="#0f172a">bilden die verschiedenen Meinungen der Bürger ab</text>
  <text x="46" y="168" font-size="15" fill="#64748b">political parties represent the different views of citizens</text>

  <line x1="300" y1="176" x2="300" y2="222" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="316" y="198" font-size="18" fill="#0f172a">5-%-Hürde</text>
  <text x="316" y="216" font-size="15" fill="#64748b">at least 5% of votes to enter</text>

  <!-- Bundestag -->
  <rect x="28" y="228" width="544" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="264" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">BUNDESTAG</text>
  <text x="300" y="290" font-size="18" fill="#0f172a" text-anchor="middle">Fraktion = alle Abgeordneten einer Partei</text>
  <text x="300" y="310" font-size="15" fill="#64748b" text-anchor="middle">a Fraktion is the group of all MPs of one party</text>

  <!-- split -->
  <line x1="300" y1="320" x2="300" y2="332" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="159" y1="332" x2="441" y2="332" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="159" y1="332" x2="159" y2="352" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="441" y1="332" x2="441" y2="352" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Two sides -->
  <rect x="20" y="356" width="278" height="158" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="159" y="388" font-size="22" font-weight="600" fill="#2563eb" text-anchor="middle">Koalition</text>
  <text x="159" y="408" font-size="15" fill="#64748b" text-anchor="middle">governing coalition</text>
  <text x="159" y="436" font-size="18" fill="#0f172a" text-anchor="middle">mehrere Parteien</text>
  <text x="159" y="458" font-size="18" fill="#0f172a" text-anchor="middle">bilden die Regierung</text>
  <text x="159" y="482" font-size="15" fill="#64748b" text-anchor="middle">several parties with the</text>
  <text x="159" y="500" font-size="15" fill="#64748b" text-anchor="middle">majority govern together</text>

  <rect x="302" y="356" width="278" height="158" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="441" y="388" font-size="22" font-weight="600" fill="#dc2626" text-anchor="middle">Opposition</text>
  <text x="441" y="408" font-size="15" fill="#64748b" text-anchor="middle">opposition</text>
  <text x="441" y="436" font-size="18" fill="#0f172a" text-anchor="middle">alle anderen</text>
  <text x="441" y="458" font-size="18" fill="#0f172a" text-anchor="middle">Abgeordneten</text>
  <text x="441" y="482" font-size="15" fill="#64748b" text-anchor="middle">all other MPs — they</text>
  <text x="441" y="500" font-size="15" fill="#64748b" text-anchor="middle">check the government</text>

  <!-- Note 1 -->
  <rect x="28" y="530" width="544" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="560" font-size="18" fill="#0f172a">Die Opposition kontrolliert die Regierung.</text>
  <text x="46" y="580" font-size="18" fill="#0f172a">Wechseln Abgeordnete die Fraktion,</text>
  <text x="46" y="600" font-size="15" fill="#64748b">The opposition checks the government; if MPs switch groups,</text>

  <!-- Note 2 -->
  <rect x="28" y="626" width="544" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="658" font-size="18" fill="#0f172a">Eine Partei, die eine Diktatur errichten will,</text>
  <text x="46" y="678" font-size="18" fill="#0f172a">ist verfassungswidrig und kann verboten werden.</text>
  <text x="46" y="700" font-size="15" fill="#64748b">A party that aims to set up a dictatorship is</text>
  <text x="46" y="718" font-size="15" fill="#64748b">unconstitutional and can be banned.</text>
</svg>
