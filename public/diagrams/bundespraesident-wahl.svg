<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Die Bundesversammlung aus allen Bundestagsabgeordneten und ebenso vielen Vertretern der Landesparlamente wählt den Bundespräsidenten, der das Land repräsentiert.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">Wer wählt den Bundespräsidenten?</text>
  <text x="28" y="70" font-size="15" fill="#64748b">Who elects the Federal President?</text>

  <!-- two sources -->
  <rect x="28" y="88" width="266" height="98" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="161" y="120" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Bundestag</text>
  <text x="161" y="144" font-size="18" fill="#0f172a" text-anchor="middle">alle Abgeordneten</text>
  <text x="161" y="164" font-size="15" fill="#64748b" text-anchor="middle">all members of the</text>
  <text x="161" y="180" font-size="15" fill="#64748b" text-anchor="middle">federal parliament</text>

  <rect x="306" y="88" width="266" height="98" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="439" y="120" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Landesparlamente</text>
  <text x="439" y="144" font-size="18" fill="#0f172a" text-anchor="middle">gleich viele Vertreter</text>
  <text x="439" y="164" font-size="15" fill="#64748b" text-anchor="middle">state parliaments elect</text>
  <text x="439" y="180" font-size="15" fill="#64748b" text-anchor="middle">the same number again</text>

  <line x1="161" y1="186" x2="161" y2="222" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="439" y1="186" x2="439" y2="222" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Bundesversammlung -->
  <rect x="28" y="228" width="544" height="94" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="264" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Bundesversammlung</text>
  <text x="300" y="290" font-size="18" fill="#0f172a" text-anchor="middle">kommt nur für diese Wahl zusammen</text>
  <text x="300" y="310" font-size="15" fill="#64748b" text-anchor="middle">Federal Convention – meets only to elect the President</text>

  <line x1="300" y1="322" x2="300" y2="366" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="312" y="344" font-size="18" font-weight="600" fill="#0f172a">wählt</text>
  <text x="366" y="344" font-size="15" fill="#64748b">elects</text>

  <!-- Bundespraesident -->
  <rect x="28" y="372" width="544" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="408" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">Bundespräsident/in</text>
  <text x="300" y="434" font-size="20" font-weight="600" fill="#0f172a" text-anchor="middle">Staatsoberhaupt · 5 Jahre</text>
  <text x="300" y="456" font-size="15" fill="#64748b" text-anchor="middle">head of state, five-year term, one re-election possible</text>

  <!-- not directly elected -->
  <rect x="28" y="484" width="544" height="124" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="48" y="506" width="176" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="136" y="530" font-size="18" fill="#0f172a" text-anchor="middle">Bürger/innen</text>
  <text x="136" y="550" font-size="15" fill="#64748b" text-anchor="middle">the citizens</text>

  <line x1="232" y1="534" x2="356" y2="534" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/>
  <line x1="282" y1="518" x2="310" y2="550" stroke="#dc2626" stroke-width="4"/>
  <line x1="310" y1="518" x2="282" y2="550" stroke="#dc2626" stroke-width="4"/>

  <text x="368" y="528" font-size="18" font-weight="700" fill="#dc2626">NICHT direkt</text>
  <text x="368" y="550" font-size="18" font-weight="700" fill="#dc2626">gewählt</text>
  <text x="48" y="584" font-size="15" fill="#64748b">The people do not elect the Federal President directly –</text>
  <text x="48" y="600" font-size="15" fill="#64748b">only the Bundesversammlung does.</text>

  <!-- role -->
  <rect x="28" y="624" width="544" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="656" font-size="22" font-weight="600" fill="#0f172a">Hauptaufgabe: repräsentiert das Land</text>
  <text x="46" y="682" font-size="18" fill="#16a34a">zeremonielle Rolle – regiert nicht</text>
  <text x="46" y="704" font-size="15" fill="#64748b">Main task: represents the country at home and abroad;</text>
  <text x="46" y="720" font-size="15" fill="#64748b">the Chancellor, not the President, leads the government.</text>
</svg>
