<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Artikel 3 Grundgesetz: Der Staat muss alle Bürgerinnen und Bürger gleich behandeln; eine Ungleichbehandlung, also Diskriminierung wegen Geschlecht, Herkunft, Glauben oder Behinderung, ist verboten.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="42" font-size="26" font-weight="700" fill="#0f172a">Gleichheit vor dem Gesetz</text>
  <text x="28" y="64" font-size="15" fill="#64748b">Equal treatment under the law</text>

  <!-- The article -->
  <rect x="28" y="80" width="544" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="114" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Artikel 3 Grundgesetz</text>
  <text x="300" y="138" font-size="18" fill="#2563eb" text-anchor="middle">Alle Menschen sind vor dem Gesetz gleich.</text>
  <text x="300" y="160" font-size="15" fill="#64748b" text-anchor="middle">Article 3 of the Basic Law: all people are equal before the law</text>

  <line x1="160" y1="176" x2="160" y2="204" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="440" y1="176" x2="440" y2="204" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Required -->
  <rect x="28" y="208" width="264" height="210" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="44" y="238" font-size="18" font-weight="700" fill="#16a34a">Geboten</text>
  <text x="44" y="256" font-size="15" fill="#64748b">required</text>
  <text x="44" y="292" font-size="22" font-weight="600" fill="#0f172a">Gleich-</text>
  <text x="44" y="314" font-size="22" font-weight="600" fill="#0f172a">behandlung</text>
  <text x="44" y="332" font-size="15" fill="#64748b">equal treatment</text>
  <text x="44" y="364" font-size="18" fill="#0f172a">durch den Staat</text>
  <text x="44" y="384" font-size="18" fill="#0f172a">und die Gerichte</text>
  <text x="44" y="402" font-size="15" fill="#64748b">by the state and the courts</text>

  <!-- Forbidden -->
  <rect x="308" y="208" width="264" height="210" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="324" y="238" font-size="18" font-weight="700" fill="#dc2626">Verboten</text>
  <text x="324" y="256" font-size="15" fill="#64748b">forbidden</text>
  <text x="324" y="292" font-size="22" font-weight="600" fill="#0f172a">Ungleich-</text>
  <line x1="321" y1="285" x2="434" y2="285" stroke="#dc2626" stroke-width="3"/>
  <text x="324" y="314" font-size="22" font-weight="600" fill="#0f172a">behandlung</text>
  <line x1="321" y1="307" x2="448" y2="307" stroke="#dc2626" stroke-width="3"/>
  <text x="324" y="332" font-size="15" fill="#64748b">unequal treatment</text>
  <text x="324" y="364" font-size="18" fill="#dc2626">= Diskriminierung</text>
  <text x="324" y="384" font-size="18" fill="#dc2626">durch den Staat</text>
  <text x="324" y="402" font-size="15" fill="#64748b">discrimination by the state</text>

  <!-- Protected characteristics -->
  <rect x="28" y="438" width="544" height="156" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="44" y="470" font-size="22" font-weight="600" fill="#0f172a">Niemand darf benachteiligt werden</text>
  <text x="44" y="496" font-size="18" fill="#0f172a">wegen Geschlecht, Abstammung, Sprache,</text>
  <text x="44" y="516" font-size="18" fill="#0f172a">Heimat und Herkunft, Glauben, religi&#246;ser oder</text>
  <text x="44" y="536" font-size="18" fill="#0f172a">politischer Anschauung oder Behinderung.</text>
  <text x="44" y="558" font-size="15" fill="#64748b">no one may be disadvantaged because of sex, descent, language,</text>
  <text x="44" y="576" font-size="15" fill="#64748b">origin, faith, religious or political views, or disability</text>

  <!-- Art 3(2) -->
  <rect x="28" y="614" width="544" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="44" y="646" font-size="22" font-weight="600" fill="#0f172a">M&#228;nner und Frauen sind gleichberechtigt.</text>
  <text x="44" y="670" font-size="18" fill="#2563eb">Artikel 3 Absatz 2 Grundgesetz</text>
  <text x="44" y="690" font-size="15" fill="#64748b">men and women have equal rights &#8211; Article 3(2) of the Basic Law</text>
</svg>
