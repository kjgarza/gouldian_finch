<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Von den Römischen Verträgen 1957 über die heutige EU mit 27 Mitgliedstaaten zum Europäischen Parlament, das alle fünf Jahre gewählt wird und an drei Orten arbeitet.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">EU und Europaparlament</text>
  <text x="28" y="70" font-size="15" fill="#64748b">The EU and the European Parliament</text>

  <!-- Origin -->
  <rect x="28" y="92" width="544" height="148" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="126" font-size="22" font-weight="600" fill="#0f172a">1957 – Römische Verträge</text>
  <text x="46" y="146" font-size="15" fill="#64748b">1957 – Treaties of Rome</text>
  <text x="46" y="172" font-size="18" fill="#0f172a">gründen die EWG, die Vorläuferin der EU</text>
  <text x="46" y="190" font-size="15" fill="#64748b">founded the EEC, forerunner of the EU</text>
  <text x="46" y="214" font-size="18" fill="#0f172a">50-jähriges Jubiläum gefeiert: 2007</text>
  <text x="46" y="232" font-size="15" fill="#64748b">50th anniversary celebrated in 2007</text>

  <line x1="300" y1="240" x2="300" y2="286" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- EU today -->
  <rect x="28" y="292" width="544" height="84" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="324" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Europäische Union heute</text>
  <text x="300" y="346" font-size="18" fill="#0f172a" text-anchor="middle">27 Mitgliedstaaten</text>
  <text x="300" y="366" font-size="15" fill="#64748b" text-anchor="middle">the EU today: 27 member states</text>

  <line x1="300" y1="376" x2="300" y2="422" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Parliament -->
  <rect x="28" y="428" width="544" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="464" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">Europäisches Parlament</text>
  <text x="300" y="484" font-size="15" fill="#64748b" text-anchor="middle">European Parliament</text>
  <text x="300" y="510" font-size="18" fill="#0f172a" text-anchor="middle">direkt gewählt – alle 5 Jahre (Europawahl)</text>
  <text x="300" y="528" font-size="15" fill="#64748b" text-anchor="middle">directly elected by EU citizens every five years</text>

  <line x1="300" y1="536" x2="300" y2="594" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="316" y="560" font-size="18" fill="#0f172a">arbeitet an drei Orten</text>
  <text x="316" y="578" font-size="15" fill="#64748b">works in three places</text>

  <!-- Three seats -->
  <rect x="20" y="600" width="180" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="110" y="636" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Straßburg</text>
  <text x="110" y="666" font-size="18" fill="#0f172a" text-anchor="middle">Plenarsitzungen</text>
  <text x="110" y="686" font-size="15" fill="#64748b" text-anchor="middle">plenary sessions</text>

  <rect x="210" y="600" width="180" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="636" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Brüssel</text>
  <text x="300" y="666" font-size="18" fill="#0f172a" text-anchor="middle">Ausschüsse</text>
  <text x="300" y="686" font-size="15" fill="#64748b" text-anchor="middle">committees</text>

  <rect x="400" y="600" width="180" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="490" y="636" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Luxemburg</text>
  <text x="490" y="666" font-size="18" fill="#0f172a" text-anchor="middle">Verwaltung</text>
  <text x="490" y="686" font-size="15" fill="#64748b" text-anchor="middle">administration</text>
</svg>
