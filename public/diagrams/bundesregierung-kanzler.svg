<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Der Bundestag wählt den Bundeskanzler oder die Bundeskanzlerin, der oder die Bundespräsident/in ernennt ihn oder sie und auf Vorschlag die Bundesminister/innen.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">Wer wählt den Bundeskanzler?</text>
  <text x="28" y="70" font-size="15" fill="#64748b">Who elects the Federal Chancellor?</text>

  <!-- Row 1 -->
  <rect x="28" y="96" width="262" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="159" y="128" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Bundestag</text>
  <text x="159" y="148" font-size="15" fill="#64748b" text-anchor="middle">federal parliament</text>

  <rect x="310" y="96" width="262" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="441" y="128" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Bundespräsident/in</text>
  <text x="441" y="148" font-size="15" fill="#64748b" text-anchor="middle">federal president</text>

  <line x1="159" y1="166" x2="159" y2="270" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="172" y="200" font-size="18" fill="#0f172a">wählt</text>
  <text x="172" y="218" font-size="15" fill="#64748b">elects</text>

  <line x1="441" y1="166" x2="441" y2="270" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="428" y="200" font-size="18" fill="#0f172a" text-anchor="end">ernennt</text>
  <text x="428" y="218" font-size="15" fill="#64748b" text-anchor="end">appoints</text>

  <!-- Row 2: the Chancellor -->
  <rect x="28" y="270" width="544" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="306" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">BUNDESKANZLER/IN</text>
  <text x="300" y="326" font-size="15" fill="#64748b" text-anchor="middle">Federal Chancellor · head of government</text>
  <text x="300" y="352" font-size="18" fill="#0f172a" text-anchor="middle">bestimmt die Richtlinien der Politik</text>
  <text x="300" y="370" font-size="15" fill="#64748b" text-anchor="middle">sets the guidelines of government policy</text>

  <line x1="300" y1="382" x2="300" y2="424" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="314" y="400" font-size="18" fill="#0f172a">schlägt Minister/innen vor</text>
  <text x="314" y="418" font-size="15" fill="#64748b">proposes the ministers</text>

  <!-- Row 3: ministers -->
  <rect x="28" y="430" width="544" height="100" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="464" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Bundesminister/innen</text>
  <text x="300" y="484" font-size="15" fill="#64748b" text-anchor="middle">federal ministers</text>
  <text x="300" y="508" font-size="18" fill="#0f172a" text-anchor="middle">ernannt vom/von der Bundespräsident/in</text>
  <text x="300" y="526" font-size="15" fill="#64748b" text-anchor="middle">appointed by the Federal President</text>

  <line x1="300" y1="530" x2="300" y2="578" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="314" y="552" font-size="18" fill="#0f172a">bilden zusammen</text>
  <text x="314" y="570" font-size="15" fill="#64748b">together they form</text>

  <!-- Row 4: the government -->
  <rect x="28" y="584" width="544" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="616" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Bundesregierung</text>
  <text x="300" y="638" font-size="18" fill="#16a34a" text-anchor="middle">Kanzler/in + alle Minister/innen</text>
  <text x="300" y="658" font-size="15" fill="#64748b" text-anchor="middle">federal government: chancellor and ministers</text>

  <!-- Note -->
  <rect x="28" y="682" width="544" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="706" font-size="18" fill="#0f172a">Nicht das Volk wählt den Kanzler, sondern der Bundestag.</text>
  <text x="46" y="726" font-size="15" fill="#64748b">The people do not elect the Chancellor — the Bundestag does.</text>
</svg>
