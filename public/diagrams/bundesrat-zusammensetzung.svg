<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Die 16 Landesregierungen entsenden Mitglieder in den Bundesrat mit 69 Stimmen, der an der Gesetzgebung des Bundes mitwirkt.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="750" fill="#ffffff"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#0f172a">Wer bildet den Bundesrat?</text>
  <text x="28" y="70" font-size="15" fill="#64748b">Who forms the Bundesrat?</text>

  <!-- Row 1: the 16 state governments -->
  <rect x="28" y="96" width="544" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="132" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Die 16 Landesregierungen</text>
  <text x="300" y="152" font-size="15" fill="#64748b" text-anchor="middle">the governments of the 16 federal states</text>
  <g fill="#2563eb">
    <rect x="66" y="168" width="26" height="16" rx="3"/><rect x="98" y="168" width="26" height="16" rx="3"/>
    <rect x="130" y="168" width="26" height="16" rx="3"/><rect x="162" y="168" width="26" height="16" rx="3"/>
    <rect x="194" y="168" width="26" height="16" rx="3"/><rect x="226" y="168" width="26" height="16" rx="3"/>
    <rect x="258" y="168" width="26" height="16" rx="3"/><rect x="290" y="168" width="26" height="16" rx="3"/>
    <rect x="322" y="168" width="26" height="16" rx="3"/><rect x="354" y="168" width="26" height="16" rx="3"/>
    <rect x="386" y="168" width="26" height="16" rx="3"/><rect x="418" y="168" width="26" height="16" rx="3"/>
    <rect x="450" y="168" width="26" height="16" rx="3"/><rect x="482" y="168" width="26" height="16" rx="3"/>
    <rect x="514" y="168" width="26" height="16" rx="3"/><rect x="546" y="168" width="18" height="16" rx="3"/>
  </g>

  <line x1="300" y1="200" x2="300" y2="238" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="312" y="224" font-size="18" fill="#0f172a">entsenden Mitglieder</text>
  <text x="312" y="242" font-size="15" fill="#64748b">send members (not elected)</text>

  <!-- Row 2: the Bundesrat itself -->
  <rect x="28" y="258" width="544" height="296" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="296" font-size="26" font-weight="700" fill="#2563eb" text-anchor="middle">BUNDESRAT</text>
  <text x="300" y="318" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">69 Stimmen insgesamt</text>
  <text x="300" y="338" font-size="15" fill="#64748b" text-anchor="middle">69 votes in total · Federal Council of the states</text>

  <g font-size="18" fill="#0f172a">
    <rect x="52" y="356" width="496" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="68" y="381" font-weight="700" fill="#2563eb">6</text>
    <text x="92" y="381">Nordrhein-Westfalen, Bayern, Baden-Württemberg,</text>
    <text x="92" y="398" font-size="15" fill="#64748b">Niedersachsen</text>

    <rect x="52" y="414" width="496" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="68" y="437" font-weight="700" fill="#2563eb">5</text>
    <text x="92" y="437">Hessen</text>

    <rect x="52" y="452" width="496" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="68" y="476" font-weight="700" fill="#2563eb">4</text>
    <text x="92" y="476">Sachsen, Rheinland-Pfalz, Berlin, Sachsen-Anhalt,</text>
    <text x="92" y="495">Thüringen, Brandenburg, Schleswig-Holstein</text>

    <rect x="52" y="508" width="496" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="68" y="531" font-weight="700" fill="#2563eb">3</text>
    <text x="92" y="531">Hamburg, Mecklenburg-Vorpommern, Saarland, Bremen</text>
  </g>

  <line x1="300" y1="554" x2="300" y2="584" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Row 3: what it does -->
  <rect x="28" y="600" width="544" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="632" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Gesetzgebung des Bundes</text>
  <text x="300" y="656" font-size="18" fill="#16a34a" text-anchor="middle">Zustimmung oder Einspruch</text>
  <text x="300" y="672" font-size="15" fill="#64748b" text-anchor="middle">federal legislation: consent or objection</text>

  <!-- Contrast note so Bundesrat and Bundestag do not get mixed up -->
  <rect x="28" y="690" width="544" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="712" font-size="18" fill="#0f172a">Nicht verwechseln: den <tspan font-weight="700" fill="#dc2626">Bundestag</tspan> wählt das Volk.</text>
  <text x="46" y="729" font-size="15" fill="#64748b">Do not confuse: the Bundestag is elected by the people.</text>
</svg>
