<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1067" width="600" height="1067"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Zeitleiste des jüdischen Lebens in Deutschland: erste dokumentierte Gemeinde um 321 in Köln, wachsendes Gemeindeleben, Schoa 1933 bis 1945, Wiederaufbau nach 1945, heute die größten Gemeinden in Berlin und München.</title>
  <rect width="600" height="1067" fill="#ffffff"/>

  <text x="28" y="44" font-size="26" font-weight="700" fill="#0f172a">J&#252;disches Leben in Deutschland</text>
  <text x="28" y="68" font-size="15" fill="#64748b">Jewish life in Germany &#8211; about 1700 years</text>

  <!-- spine -->
  <line x1="64" y1="120" x2="64" y2="912" stroke="#cbd5e1" stroke-width="4"/>

  <!-- 1: 321 -->
  <circle cx="64" cy="150" r="11" fill="#64748b"/>
  <rect x="100" y="110" width="472" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="144" font-size="18" font-weight="700" fill="#0f172a">um 321 n. Chr.</text>
  <text x="118" y="176" font-size="22" font-weight="600" fill="#0f172a">Erste j&#252;dische Gemeinde in K&#246;ln</text>
  <text x="118" y="200" font-size="18" fill="#0f172a">r&#246;misches Edikt &#8211; vor rund 1700 Jahren</text>
  <text x="118" y="224" font-size="15" fill="#64748b">first documented Jewish community on German soil</text>

  <!-- 2: Middle Ages -->
  <circle cx="64" cy="330" r="11" fill="#64748b"/>
  <rect x="100" y="290" width="472" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="324" font-size="18" font-weight="700" fill="#0f172a">Mittelalter bis 1900</text>
  <text x="118" y="356" font-size="22" font-weight="600" fill="#0f172a">Gemeindeleben w&#228;chst</text>
  <text x="118" y="380" font-size="18" fill="#0f172a">Bl&#252;tezeiten und Verfolgungen</text>
  <text x="118" y="404" font-size="15" fill="#64748b">community life grows, but is repeatedly persecuted</text>

  <!-- 3: 1933-1945 -->
  <circle cx="64" cy="510" r="11" fill="#dc2626"/>
  <rect x="100" y="470" width="472" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="118" y="504" font-size="18" font-weight="700" fill="#dc2626">1933 &#8211; 1945</text>
  <text x="118" y="536" font-size="22" font-weight="600" fill="#0f172a">NS-Zeit: Schoa / Holocaust</text>
  <text x="118" y="560" font-size="18" fill="#0f172a">J&#252;disches Leben wird zerst&#246;rt</text>
  <text x="118" y="584" font-size="15" fill="#64748b">Nazi era: six million Jews murdered</text>

  <!-- 4: after 1945 -->
  <circle cx="64" cy="690" r="11" fill="#64748b"/>
  <rect x="100" y="650" width="472" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="684" font-size="18" font-weight="700" fill="#0f172a">nach 1945</text>
  <text x="118" y="716" font-size="22" font-weight="600" fill="#0f172a">Wiederaufbau der Gemeinden</text>
  <text x="118" y="740" font-size="18" font-weight="600" fill="#0f172a">Zuwanderung ab den 1990er Jahren</text>
  <text x="118" y="764" font-size="15" fill="#64748b">communities rebuilt; immigration from the 1990s</text>

  <!-- 5: today -->
  <circle cx="64" cy="870" r="11" fill="#2563eb"/>
  <rect x="100" y="830" width="472" height="165" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="118" y="864" font-size="18" font-weight="700" fill="#2563eb">heute</text>
  <text x="118" y="896" font-size="22" font-weight="600" fill="#0f172a">Gr&#246;&#223;te j&#252;dische Gemeinden:</text>
  <text x="118" y="930" font-size="26" font-weight="700" fill="#2563eb">Berlin und M&#252;nchen</text>
  <text x="118" y="954" font-size="15" fill="#64748b">today the largest Jewish communities in Germany</text>
  <text x="118" y="974" font-size="15" fill="#64748b">are in Berlin and Munich</text>
</svg>
