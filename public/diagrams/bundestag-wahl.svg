<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Auf dem Stimmzettel w&#228;hlt die Erststimme eine Person im Wahlkreis, die Zweitstimme eine Partei; die Zweitstimme entscheidet &#252;ber die Sitze und die 5-Prozent-H&#252;rde.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="800" fill="#ffffff"/>

  <text x="28" y="44" font-size="26" font-weight="700" fill="#0f172a">Erststimme &amp; Zweitstimme</text>
  <text x="28" y="68" font-size="15" fill="#64748b">The Bundestag ballot has two votes &#8211; one cross in each column</text>

  <!-- ballot -->
  <rect x="28" y="88" width="544" height="250" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="46" y="116" font-size="18" font-weight="700" fill="#0f172a">Stimmzettel &#8211; ein Kreuz pro Spalte</text>
  <text x="46" y="134" font-size="15" fill="#64748b">ballot paper: two crosses in one column make it invalid</text>

  <!-- left column -->
  <rect x="44" y="142" width="250" height="182" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="169" y="174" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Erststimme</text>
  <text x="169" y="194" font-size="15" fill="#64748b" text-anchor="middle">first vote</text>
  <rect x="158" y="206" width="22" height="22" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <path d="M162,210 L176,224 M176,210 L162,224" stroke="#0f172a" stroke-width="2.5"/>
  <text x="169" y="252" font-size="18" fill="#0f172a" text-anchor="middle">eine Person</text>
  <text x="169" y="272" font-size="18" fill="#0f172a" text-anchor="middle">im Wahlkreis</text>
  <text x="169" y="292" font-size="15" fill="#64748b" text-anchor="middle">one candidate in your</text>
  <text x="169" y="308" font-size="15" fill="#64748b" text-anchor="middle">constituency (direct seat)</text>

  <!-- right column -->
  <rect x="306" y="142" width="250" height="182" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="431" y="174" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">Zweitstimme</text>
  <text x="431" y="194" font-size="15" fill="#64748b" text-anchor="middle">second vote</text>
  <rect x="420" y="206" width="22" height="22" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <path d="M424,210 L438,224 M438,210 L424,224" stroke="#2563eb" stroke-width="2.5"/>
  <text x="431" y="252" font-size="18" fill="#0f172a" text-anchor="middle">eine Partei</text>
  <text x="431" y="272" font-size="18" fill="#0f172a" text-anchor="middle">(Parteiliste)</text>
  <text x="431" y="292" font-size="15" fill="#64748b" text-anchor="middle">one party list &#8211; this vote</text>
  <text x="431" y="308" font-size="15" fill="#64748b" text-anchor="middle">decides the seats</text>

  <line x1="431" y1="340" x2="431" y2="372" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- seats -->
  <rect x="28" y="376" width="544" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="404" font-size="18" fill="#0f172a">Mehr Zweitstimmen &#8594; mehr Sitze im Bundestag</text>
  <text x="46" y="424" font-size="15" fill="#64748b">a party&#8217;s share of second votes decides how many seats it gets</text>

  <!-- 5% -->
  <rect x="28" y="452" width="544" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="480" font-size="18" font-weight="700" fill="#0f172a">Die 5-%-H&#252;rde</text>
  <text x="46" y="497" font-size="15" fill="#64748b">the five-percent threshold for the Zweitstimme</text>

  <rect x="60" y="520" width="72" height="96" fill="#2563eb"/>
  <rect x="160" y="560" width="72" height="56" fill="#2563eb"/>
  <rect x="260" y="584" width="72" height="32" fill="#cbd5e1"/>
  <rect x="360" y="600" width="72" height="16" fill="#cbd5e1"/>
  <line x1="44" y1="616" x2="556" y2="616" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="44" y1="576" x2="556" y2="576" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="556" y="570" font-size="18" font-weight="700" fill="#dc2626" text-anchor="end">5 %</text>
  <text x="556" y="600" font-size="15" fill="#64748b" text-anchor="end">threshold</text>
  <g font-size="15" fill="#64748b" text-anchor="middle">
    <text x="96" y="636">12 %</text>
    <text x="196" y="636">7 %</text>
    <text x="296" y="636">4 %</text>
    <text x="396" y="636">2 %</text>
  </g>
  <text x="46" y="662" font-size="18" fill="#0f172a">blau: im Bundestag &#183; grau: unter 5 %</text>
  <text x="46" y="680" font-size="15" fill="#64748b">blue: wins seats &#183; grey: below the threshold, no seats</text>

  <!-- caption -->
  <rect x="28" y="696" width="544" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="722" font-size="18" fill="#0f172a">Zusammen: personalisierte Verh&#228;ltniswahl</text>
  <text x="46" y="739" font-size="15" fill="#64748b">majority vote plus proportional vote in one ballot</text>
  <text x="46" y="762" font-size="18" fill="#0f172a">Ausnahme: 3 Direktmandate gen&#252;gen auch</text>
  <text x="46" y="779" font-size="15" fill="#64748b">3 direct seats let a party in even below 5 %</text>
</svg>
