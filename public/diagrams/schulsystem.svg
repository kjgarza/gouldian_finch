<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Das deutsche Schulsystem im Überblick: Kindergarten, Grundschule, dann Hauptschule, Realschule oder Gymnasium mit Abitur, danach Berufsausbildung im dualen System oder Studium; Bildung ist Ländersache.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="600" height="800" fill="#ffffff"/>

  <text x="28" y="42" font-size="26" font-weight="700" fill="#0f172a">Das deutsche Schulsystem</text>
  <text x="28" y="64" font-size="15" fill="#64748b">The German school system &#8211; the common pattern; details differ by state</text>

  <!-- Kindergarten -->
  <rect x="28" y="80" width="544" height="68" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="110" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Kindergarten / Kita</text>
  <text x="300" y="132" font-size="15" fill="#64748b" text-anchor="middle">nursery &#8211; voluntary, a place is guaranteed from age 1</text>

  <line x1="300" y1="148" x2="300" y2="174" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Grundschule -->
  <rect x="28" y="178" width="544" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="208" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Grundschule</text>
  <text x="300" y="230" font-size="18" fill="#0f172a" text-anchor="middle">Klasse 1 bis 4</text>
  <text x="300" y="248" font-size="15" fill="#64748b" text-anchor="middle">primary school from about age 6 (Berlin/Brandenburg: 1&#8211;6)</text>

  <line x1="114" y1="256" x2="114" y2="288" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="300" y1="256" x2="300" y2="288" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="486" y1="256" x2="486" y2="288" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Secondary tracks -->
  <rect x="28" y="292" width="172" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="114" y="326" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Hauptschule</text>
  <text x="114" y="346" font-size="15" fill="#64748b" text-anchor="middle">basic track</text>
  <text x="114" y="380" font-size="18" fill="#0f172a" text-anchor="middle">Klasse 5&#8211;9/10</text>
  <text x="114" y="414" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Hauptschul-</text>
  <text x="114" y="434" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">abschluss</text>
  <text x="114" y="452" font-size="15" fill="#64748b" text-anchor="middle">leaving cert.</text>

  <rect x="214" y="292" width="172" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="326" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Realschule</text>
  <text x="300" y="346" font-size="15" fill="#64748b" text-anchor="middle">middle track</text>
  <text x="300" y="380" font-size="18" fill="#0f172a" text-anchor="middle">Klasse 5&#8211;10</text>
  <text x="300" y="414" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Mittlerer</text>
  <text x="300" y="434" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Abschluss</text>
  <text x="300" y="452" font-size="15" fill="#64748b" text-anchor="middle">leaving cert.</text>

  <rect x="400" y="292" width="172" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="486" y="326" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Gymnasium</text>
  <text x="486" y="346" font-size="15" fill="#64748b" text-anchor="middle">academic track</text>
  <text x="486" y="380" font-size="18" fill="#0f172a" text-anchor="middle">Klasse 5&#8211;12/13</text>
  <text x="486" y="414" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">Abitur</text>
  <text x="486" y="434" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">Hochschulreife</text>
  <text x="486" y="452" font-size="15" fill="#64748b" text-anchor="middle">uni entrance</text>

  <line x1="114" y1="462" x2="150" y2="498" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="300" y1="462" x2="200" y2="498" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="486" y1="462" x2="440" y2="498" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Outcomes -->
  <rect x="28" y="502" width="264" height="126" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="536" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Berufsausbildung</text>
  <text x="160" y="560" font-size="18" fill="#0f172a" text-anchor="middle">duales System</text>
  <text x="160" y="580" font-size="18" fill="#0f172a" text-anchor="middle">Betrieb + Berufsschule</text>
  <text x="160" y="602" font-size="15" fill="#64748b" text-anchor="middle">vocational training: company</text>
  <text x="160" y="620" font-size="15" fill="#64748b" text-anchor="middle">plus vocational school</text>

  <rect x="308" y="502" width="264" height="126" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="536" font-size="22" font-weight="600" fill="#0f172a" text-anchor="middle">Studium</text>
  <text x="440" y="560" font-size="18" fill="#0f172a" text-anchor="middle">Universit&#228;t /</text>
  <text x="440" y="580" font-size="18" fill="#0f172a" text-anchor="middle">Fachhochschule</text>
  <text x="440" y="602" font-size="15" fill="#64748b" text-anchor="middle">university studies &#8211;</text>
  <text x="440" y="620" font-size="15" fill="#64748b" text-anchor="middle">Abitur normally required</text>

  <!-- Footnote -->
  <rect x="28" y="648" width="544" height="122" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="44" y="680" font-size="18" fill="#0f172a">Gesamtschule: fasst mehrere Schularten zusammen.</text>
  <text x="44" y="700" font-size="15" fill="#64748b">comprehensive school combining the tracks</text>
  <text x="44" y="732" font-size="18" fill="#0f172a">Bildung ist L&#228;ndersache.</text>
  <text x="44" y="752" font-size="15" fill="#64748b">education is run by the 16 federal states &#8211; details differ</text>
</svg>
